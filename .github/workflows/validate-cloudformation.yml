name: Validate Repository

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation:
    name: CloudFormation, shell, and Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python validation tools
        run: pip install cfn-lint==1.52.0 shellcheck-py==0.11.0.1

      - name: Validate CloudFormation templates
        run: cfn-lint cloudformation/lifeos-s3-archive.yaml

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Markdown tooling
        run: npm ci

      - name: Validate Markdown
        run: npm run lint:md

  secret-scan:
    # Renamed from "Secret scan (full history)": gitleaks-action scopes its
    # scan to the triggering event's commits regardless of checkout depth,
    # so the old name asserted a guarantee this job doesn't provide. The
    # genuine recurring full-history layer is full-history-scan.yml, which
    # runs the gitleaks CLI directly over all refs on a weekly schedule and
    # via workflow_dispatch.
    name: Secret scan (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out complete history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1

  tests:
    name: Shell workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run shell workflow tests
        run: |
          status=0
          for test in tests/test_*.sh; do
            echo "=== ${test}"
            if ! bash "$test"; then
              echo "FAIL: ${test}"
              status=1
            fi
          done
          exit "$status"
