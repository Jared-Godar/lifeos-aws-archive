[project]
name = "lifeos-aws-archive"
version = "0.1.0"
description = "Secure AWS archival infrastructure, automation, and recovery workflows"
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.39",
    "click>=8.4.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "cfn-lint>=1.52.1",
    "pre-commit>=4.6.1",
    "shellcheck-py==0.11.0.1",
]
