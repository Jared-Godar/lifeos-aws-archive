# yaml-language-server: $schema=../.vscode/cloudformation.schema.json
AWSTemplateFormatVersion: "2010-09-09"
Description: LifeOS S3 archive bucket for media, documents, manifests, and backup staging.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name, e.g. lifeos-archive-example

Resources:
  LifeOSArchiveLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${BucketName}-logs"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "${BucketName}-logs"
        LogFilePrefix: self-logs/
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  LifeOSArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BucketName

      LoggingConfiguration:
        DestinationBucketName: !Ref LifeOSArchiveLogBucket
        LogFilePrefix: logs/

      Tags:
        - Key: Project
          Value: LifeOS
        - Key: Component
          Value: AWSArchiveMigration
        - Key: Owner
          Value: lifeos-admin
        - Key: Purpose
          Value: ArchiveBackup
        - Key: ManagedBy
          Value: CloudFormation

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      LifecycleConfiguration:
        Rules:
          - Id: PhotosStandardToGlacier
            Status: Enabled
            Prefix: photos/
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: VideoStandardToGlacier
            Status: Enabled
            Prefix: video/
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: AudioStandardToGlacier
            Status: Enabled
            Prefix: audio/
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: DocumentsLifecycle
            Status: Enabled
            Prefix: documents/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: ObsidianLifecycle
            Status: Enabled
            Prefix: obsidian/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: LegacyArchiveLifecycle
            Status: Enabled
            Prefix: archive/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER_IR
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 90

          - Id: ManifestRetention
            Status: Enabled
            Prefix: manifests/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
            NoncurrentVersionTransitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30

          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  LifeOSArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref LifeOSArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${LifeOSArchiveBucket.Arn}"
              - !Sub "${LifeOSArchiveBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  BucketName:
    Description: Created S3 archive bucket name.
    Value: !Ref LifeOSArchiveBucket

  BucketArn:
    Description: Created S3 archive bucket ARN.
    Value: !GetAtt LifeOSArchiveBucket.Arn

  LogBucketName:
    Description: S3 access log bucket name.
    Value: !Ref LifeOSArchiveLogBucket

  ExampleGoProSyncCommand:
    Description: Example guarded GoPro upload command from the repository root.
    Value: !Sub "BUCKET=${BucketName} scripts/sync_gopro_to_s3.sh --execute"

  ExampleManifestCommands:
    Description: Example guarded GoPro manifest commands from the repository root.
    Value: !Sub "scripts/generate_manifest.sh ~/Movies/GoPro manifests gopro && BUCKET=${BucketName} COLLECTION=gopro scripts/upload_manifests_to_s3.sh --execute"
