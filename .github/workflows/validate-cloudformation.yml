name: Validate Repository

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validation:
    name: CloudFormation, shell, and Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python validation tools
        run: pip install cfn-lint==1.52.0 shellcheck-py==0.11.0.1

      - name: Validate CloudFormation templates
        run: cfn-lint cloudformation/*.yaml

      - name: Validate shell scripts
        run: shellcheck scripts/*.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Markdown tooling
        run: npm ci

      - name: Validate Markdown
        run: npm run lint:md
